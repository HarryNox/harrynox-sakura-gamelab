<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameLab iOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="status-bar">
        <span>9:41</span>
        <span>📶 🔋</span>
    </div>

    <!-- 
      【画像を設定する方法】
      各アイコンの `style="background-image: url('');"` のクォーテーションの中に画像のファイルパスを入れてください。
      （例: style="background-image: url('./images/my-icon.png');"）
      画像を設定した場合は、中にある絵文字（🐸など）を削除すると綺麗に表示されます！
    -->
    <main class="home-screen">
        <a href="./frog_jump/index.html" class="app-icon">
            <div class="icon-img frog-bg" style="background-image: url('');">🐸</div>
            <span class="app-name">フロッグ</span>
        </a>
        <a href="./breakout/index.html" class="app-icon">
            <div class="icon-img breakout-bg" style="background-image: url('');">🧱</div>
            <span class="app-name">ブロック崩し</span>
        </a>
        <a href="./snake/index.html" class="app-icon">
            <div class="icon-img snake-bg" style="background-image: url('');">🐍</div>
            <span class="app-name">スネーク</span>
        </a>
        <a href="./memory/index.html" class="app-icon">
            <div class="icon-img memory-bg" style="background-image: url('');">🎴</div>
            <span class="app-name">神経衰弱</span>
        </a>
        <a href="./minesweeper/index.html" class="app-icon">
            <div class="icon-img mine-bg" style="background-image: url('');">💣</div>
            <span class="app-name">マイン</span>
        </a>
        <a href="./gravity_runner/index.html" class="app-icon">
            <div class="icon-img gravity-bg" style="background-image: url('');">🔃</div>
            <span class="app-name">重力ゲーム</span>
        </a>
        <a href="./race_game/index.html" class="app-icon">
            <div class="icon-img race-bg" style="background-image: url('');">🏎️</div>
            <span class="app-name">レース</span>
        </a>
        <a href="./flappy_bird/index.html" class="app-icon">
            <div class="icon-img flappy-bg" style="background-image: url('');">🐦</div>
            <span class="app-name">フラッピー</span>
        </a>
    </main>

</body>
</html>
